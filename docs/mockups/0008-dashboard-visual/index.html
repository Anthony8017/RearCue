<h1>RearCue 背屏美化 · 三方向效果图（无时间版）</h1>
<p class="lead">
每张图左＝常态（横幅在场，隐私档文案），右＝通知到达瞬间（整屏呼吸 ≈3 秒 + 新图标高亮至横幅销毁）。
已按真机 904×572 比例绘制，左侧深色带＝背屏相机带，四角圆角与真机一致。
挑一个方向回复 <code>A / B / C</code> 即可，也可以指定混搭（例如「B 的光环 + C 的图标尺寸」）。
</p>
